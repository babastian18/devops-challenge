apiVersion: apps/v1
kind: Deployment
metadata:
  name: helios-api
  namespace: helios-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: helios-api
  template:
    metadata:
      labels:
        app: helios-api
    spec:
      containers:
        - name: helios-api
          image: helios-ai/api:v2.1.4
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: helios-api-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: helios-api-config
                  key: REDIS_URL
            - name: REDIS_SSL
              valueFrom:
                configMapKeyRef:
                  name: helios-api-config
                  key: REDIS_SSL
